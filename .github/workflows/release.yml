name: Build and Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use_cross: false
            artifact_name: bf
            asset_name: bf-linux-x86_64

          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            use_cross: true
            artifact_name: bf
            asset_name: bf-linux-aarch64

          - os: macos-latest
            target: x86_64-apple-darwin
            use_cross: false
            artifact_name: bf
            asset_name: bf-macos-x86_64

          - os: macos-latest
            target: aarch64-apple-darwin
            use_cross: false
            artifact_name: bf
            asset_name: bf-macos-aarch64

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            use_cross: false
            artifact_name: bf.exe
            asset_name: bf-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross

      - name: Build with cargo
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build with cross
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Strip binary (Unix)
        if: runner.os != 'Windows' && !matrix.use_cross
        run: strip target/${{ matrix.target }}/release/${{ matrix.artifact_name }} || true

      - name: Prepare assets
        run: cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} ${{ matrix.asset_name }}
        shell: bash

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ./${{ matrix.asset_name }}
