name: Deploy Web Playground

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - "crates/web/**"
      - "crates/interpreter/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32-unknown-unknown

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build Wasm bindings
        working-directory: web
        run: pnpm run wasm

      - name: Build static bundle
        working-directory: web
        run: pnpm run build

      # Project name and output directory come from web/wrangler.jsonc.
      # npx installs wrangler into its own cache, which keeps the strict
      # `allowBuilds` policy in web/pnpm-workspace.yaml untouched (the
      # wrangler GitHub action would `pnpm add wrangler` and fail on workerd).
      - name: Deploy to Cloudflare Pages
        working-directory: web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy --branch=$GITHUB_REF_NAME
